  width: 640
  height: 480

cameras:
  head:
    enabled: true
    namespace: "camera3"
    serial: "838212070714"
    color: "/camera3/camera/color/image_raw"
    depth: "/camera3/camera/depth/image_rect_raw"
  right_wrist:
    enabled: true
    namespace: "camera2"
    serial: "838212074317"
    color: "/camera2/camera/color/image_raw"
    depth: "/camera2/camera/depth/image_rect_raw"
